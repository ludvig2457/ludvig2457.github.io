<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LudvigAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236c5ce7'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>L</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--bg2:#131318;--bg3:#1a1a21;--text:#ececf1;--text2:#a1a1aa;--text3:#6b6b75;--accent:#6c5ce7;--accent2:#8b7cf0;--glow:rgba(108,92,231,.35);--border:#26262e;--border2:#35353f;--userbg:linear-gradient(135deg,#6c5ce7,#8b7cf0);--asstbg:#1a1a21;--codebg:#0d0d11;--ok:#00d68f;--bad:#ff3d71;--shadow:0 8px 32px rgba(0,0,0,.4);--r:16px;--rs:10px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono","Fira Code",Consolas,monospace}
[data-theme="light"]{--bg:#fff;--bg2:#f7f7f9;--bg3:#f0f0f3;--text:#111118;--text2:#52525b;--text3:#8a8a93;--border:#e4e4e7;--border2:#d4d4d8;--asstbg:#f7f7f9;--codebg:#f7f7f9;--shadow:0 8px 32px rgba(0,0,0,.08)}
[data-theme="amoled"]{--bg:#000;--bg2:#0a0a0a;--bg3:#121212;--border:#1a1a1a;--border2:#262626;--asstbg:#0a0a0a;--codebg:#000}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
.auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top left,rgba(108,92,231,.15),transparent 50%),radial-gradient(circle at bottom right,rgba(139,124,240,.1),transparent 50%),var(--bg);z-index:1000;transition:opacity .3s}
.auth.hidden{opacity:0;pointer-events:none}
.auth-card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:40px 32px;box-shadow:var(--shadow);animation:up .5s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;justify-content:center}
.auth-icon{width:56px;height:56px;background:var(--userbg);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;box-shadow:0 0 32px var(--glow)}
.auth-logo h1{font-size:22px;font-weight:700}
.auth-logo p{font-size:12px;color:var(--text3);margin-top:2px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:24px}
.tab{flex:1;padding:10px;background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;transition:all .2s}
.tab.active{background:var(--bg3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.form{display:none}
.form.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.fg input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:12px 16px;border-radius:12px;font-family:inherit;font-size:15px;outline:none;transition:all .2s}
.fg input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.btn{width:100%;padding:14px;background:var(--userbg);border:none;color:#fff;font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;transition:all .2s;box-shadow:0 0 24px var(--glow);margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px var(--glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err{background:rgba(255,61,113,.1);border:1px solid var(--bad);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.err.show{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ft{text-align:center;margin-top:20px;font-size:12px;color:var(--text3)}
.app{display:none;height:100vh;height:100dvh}
.app.active{display:flex}
.side{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s;z-index:100}
.side-h{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo-i{width:32px;height:32px;background:var(--userbg);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 0 20px var(--glow)}
.side-b{flex:1;overflow-y:auto;padding:12px}
.newc{width:100%;padding:10px 12px;background:transparent;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s;margin-bottom:12px}
.newc:hover{border-color:var(--accent);color:var(--accent);background:var(--bg3)}
.ci{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--rs);cursor:pointer;color:var(--text2);font-size:13px;transition:background .15s;margin-bottom:2px}
.ci:hover{background:var(--bg3);color:var(--text)}
.ci.active{background:var(--bg3);color:var(--text)}
.ci-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-d{opacity:0;background:transparent;border:none;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:14px}
.ci:hover .ci-d{opacity:1}
.ci-d:hover{color:var(--bad)}
.side-f{padding:12px;border-top:1px solid var(--border)}
.uc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--rs);cursor:pointer;transition:background .15s;margin-bottom:8px}
.uc:hover{background:var(--bg3)}
.ua{width:32px;height:32px;border-radius:50%;background:var(--userbg);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.ui{flex:1;min-width:0}
.un{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.us{font-size:11px;color:var(--text3)}
.sa{display:flex;gap:6px}
.ib{flex:1;background:transparent;border:1px solid var(--border);color:var(--text2);height:36px;border-radius:var(--rs);cursor:pointer;font-size:15px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;background:var(--bg)}
.mb{display:none;background:transparent;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:var(--rs);cursor:pointer;font-size:18px}
.tt{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text2);font-weight:500}
.bdg-d{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.msgs{flex:1;overflow-y:auto;padding:24px}
.msgs-i{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;gap:14px;animation:in .3s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ma{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.msg.user .ma{background:var(--userbg)}
.msg.assistant .ma{background:var(--bg3);border:1px solid var(--border2);color:var(--accent2);box-shadow:0 0 16px var(--glow)}
.mb2{flex:1;min-width:0}
.mn{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.mt{font-weight:400}
.mc{font-size:15px;line-height:1.65;color:var(--text);word-wrap:break-word;overflow-wrap:break-word}
.msg.user .mc{background:var(--bg2);border:1px solid var(--border);padding:12px 16px;border-radius:var(--r);border-top-left-radius:4px}
.msg.assistant .mc{padding:2px 0}
.mc p{margin:0 0 12px}
.mc p:last-child{margin-bottom:0}
.mc h1,.mc h2,.mc h3{margin:16px 0 8px;font-weight:700;line-height:1.3}
.mc h1{font-size:20px}.mc h2{font-size:17px}.mc h3{font-size:15px}
.mc ul,.mc ol{margin:8px 0 12px 20px}
.mc li{margin:4px 0}
.mc a{color:var(--accent2);text-decoration:none}
.mc a:hover{text-decoration:underline}
.mc blockquote{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--text2);background:var(--bg2);border-radius:0 var(--rs) var(--rs) 0}
.mc code:not(pre code){background:var(--bg2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent2)}
.mc hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.cb{background:var(--codebg);border:1px solid var(--border);border-radius:var(--rs);margin:12px 0;overflow:hidden;font-family:var(--mono);font-size:13px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--text3);font-family:var(--font);font-weight:500}
.cl{text-transform:uppercase;letter-spacing:.05em}
.cc{background:transparent;border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.cc:hover{color:var(--accent2);border-color:var(--accent)}
.cc.copied{color:var(--ok);border-color:var(--ok)}
.cb pre{margin:0;padding:12px;overflow-x:auto;line-height:1.5;white-space:pre;tab-size:4}
.cb code{font-family:var(--mono);font-size:13px}
.tk-kw{color:#c792ea;font-weight:600}
.tk-str{color:#c3e88d}
.tk-num{color:#f78c6c}
.tk-com{color:#546e7a;font-style:italic}
.tk-fn{color:#82aaff}
.tk-type{color:#ffcb6b}
[data-theme="light"] .tk-kw{color:#8b3cf0}
[data-theme="light"] .tk-str{color:#0a8a3a}
[data-theme="light"] .tk-num{color:#c05000}
[data-theme="light"] .tk-com{color:#8a8a93}
[data-theme="light"] .tk-fn{color:#0066cc}
[data-theme="light"] .tk-type{color:#b8860b}
.typ{display:inline-flex;gap:4px;padding:4px 0}
.typ span{width:7px;height:7px;background:var(--text3);border-radius:50%;animation:bnc 1.4s infinite ease-in-out}
.typ span:nth-child(1){animation-delay:-.32s}
.typ span:nth-child(2){animation-delay:-.16s}
@keyframes bnc{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.mac{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .2s}
.msg:hover .mac{opacity:1}
.mab{background:transparent;border:1px solid var(--border);color:var(--text3);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.mab:hover{color:var(--accent2);border-color:var(--accent);background:var(--bg2)}
.ia{padding:16px 24px 20px;border-top:1px solid var(--border);background:var(--bg)}
.iw{max-width:820px;margin:0 auto;position:relative;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);transition:border-color .2s,box-shadow .2s;display:flex;align-items:flex-end;padding:8px 8px 8px 16px;gap:8px}
.iw:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
#inp{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;resize:none;outline:none;padding:8px 0;max-height:200px;line-height:1.5}
#inp::placeholder{color:var(--text3)}
.sb{background:var(--userbg);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;box-shadow:0 0 16px var(--glow)}
.sb:hover:not(:disabled){transform:scale(1.05)}
.sb:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ih{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--text3);text-align:center}
.sbt{position:fixed;bottom:120px;right:32px;width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);cursor:pointer;font-size:16px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:50;transition:all .2s}
.sbt.visible{display:flex}
.sbt:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:1000;opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none}
.tst.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.mo.show{display:flex}
.md{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);animation:up .3s}
.md h2{font-size:18px;margin-bottom:16px;font-weight:700}
.mr{margin-bottom:16px}
.mr label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mr input,.mr select{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:var(--rs);font-family:inherit;font-size:14px;outline:none}
.mr input:focus,.mr select:focus{border-color:var(--accent)}
.mac2{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.b1{padding:10px 20px;border-radius:var(--rs);border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .15s;background:var(--userbg);color:#fff;box-shadow:0 0 16px var(--glow)}
.b1:hover{transform:translateY(-1px)}
.b2{padding:10px 20px;border-radius:var(--rs);border:1px solid var(--border2);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .15s;background:transparent;color:var(--text2)}
.b2:hover{background:var(--bg3);color:var(--text)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.emp-i{font-size:48px;margin-bottom:16px;opacity:.5}
.empty h3{color:var(--text);margin-bottom:8px;font-size:18px}
.empty p{font-size:14px}
.qp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:24px;max-width:700px;margin-left:auto;margin-right:auto}
.qpb{background:var(--bg2);border:1px solid var(--border);padding:14px;border-radius:var(--rs);cursor:pointer;text-align:left;color:var(--text2);font-family:inherit;font-size:13px;transition:all .15s}
.qpb:hover{border-color:var(--accent);color:var(--text);background:var(--bg3);transform:translateY(-2px)}
.qpb strong{display:block;color:var(--text);margin-bottom:4px;font-size:13px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
@media(max-width:768px){.side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);box-shadow:var(--shadow)}.side.open{transform:translateX(0)}.mb{display:flex;align-items:center;justify-content:center}.msgs{padding:16px}.ia{padding:12px 16px 16px}.sbt{bottom:100px;right:16px}.top{padding:0 12px}.auth-card{padding:32px 24px}}
@media(max-width:480px){.ma{display:none}.qp{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="auth" id="auth">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-icon">L</div>
            <div><h1>LudvigAI</h1><p>Open Source · C++ · ASM</p></div>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>
        <div class="err" id="err"></div>

        <form class="form active" id="login-form" onsubmit="return doLogin(event)">
            <div class="fg"><label>Логин</label><input type="text" id="login-user" required autocomplete="username"></div>
            <div class="fg"><label>Пароль</label><input type="password" id="login-pass" required autocomplete="current-password"></div>
            <button class="btn" type="submit">Войти</button>
        </form>

        <form class="form" id="register-form" onsubmit="return doRegister(event)">
            <div class="fg"><label>Логин</label><input type="text" id="reg-user" required minlength="3" maxlength="20" autocomplete="username"></div>
            <div class="fg"><label>Пароль</label><input type="password" id="reg-pass" required minlength="4" autocomplete="new-password"></div>
            <div class="fg"><label>Повтор пароля</label><input type="password" id="reg-pass2" required autocomplete="new-password"></div>
            <button class="btn" type="submit">Создать аккаунт</button>
        </form>

        <div class="ft">Локальная авторизация · без сервера</div>
    </div>
</div>

<div class="app" id="app">
    <aside class="side" id="side">
        <div class="side-h">
            <div class="logo"><div class="logo-i">L</div><span>LudvigAI</span></div>
        </div>
        <div class="side-b">
            <button class="newc" id="newc">+ Новый чат</button>
            <div id="chat-list"></div>
        </div>
        <div class="side-f">
            <div class="uc" id="user-card">
                <div class="ua" id="ua">?</div>
                <div class="ui"><div class="un" id="un">Гость</div><div class="us">Local</div></div>
            </div>
            <div class="sa">
                <button class="ib" id="btn-settings" title="Настройки">⚙</button>
                <button class="ib" id="btn-export" title="Экспорт">⬇</button>
                <button class="ib" id="btn-theme" title="Тема">🌙</button>
                <button class="ib" id="btn-logout" title="Выйти">⏻</button>
            </div>
        </div>
    </aside>

    <main class="main">
        <header class="top">
            <button class="mb" id="mb">☰</button>
            <div class="tt" id="tt">Новый чат</div>
            <div class="bdg"><span class="bdg-d"></span><span>Local Mode</span></div>
        </header>
        <div class="msgs" id="msgs"><div class="msgs-i" id="msgs-i"></div></div>
        <div class="ia">
            <div class="iw">
                <textarea id="inp" placeholder="Напиши сообщение..." rows="1"></textarea>
                <button class="sb" id="sb">➤</button>
            </div>
            <div class="ih">Enter — отправить · Shift+Enter — новая строка · Ctrl+K — новый чат</div>
        </div>
    </main>
</div>

<button class="sbt" id="sbt">↓</button>
<div class="tst" id="tst"></div>

<div class="mo" id="mo">
    <div class="md">
        <h2>Настройки</h2>
        <div class="mr"><label>API URL</label><input type="text" id="api-url" placeholder="http://localhost:8080/v1/chat/completions"></div>
        <div class="mr"><label>Модель</label><input type="text" id="api-model" value="ludvigai"></div>
        <div class="mr"><label>Тема</label><select id="theme-select"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="amoled">AMOLED</option></select></div>
        <div class="mac2">
            <button class="b2" id="mo-cancel">Отмена</button>
            <button class="b1" id="mo-save">Сохранить</button>
        </div>
    </div>
</div>

<script>
/* ==================== CONFIG ==================== */
const CFG = {
    apiUrl: localStorage.getItem("lai_api") || "http://localhost:8080/v1/chat/completions",
    model: localStorage.getItem("lai_model") || "ludvigai",
    theme: localStorage.getItem("lai_theme") || "dark",
};
const SYS = "Ты LudvigAI — нейросеть на C++ и ассемблере. Отвечай кратко. Помогаешь с C++, ассемблером, реверсом, играми. Код в ```code blocks```.";

/* ==================== STATE ==================== */
let state = {
    users: JSON.parse(localStorage.getItem("lai_users") || "{}"),
    current: localStorage.getItem("lai_current") || null,
    chats: [],
    activeChat: null,
    generating: false,
    abort: null,
    p2p: null,
};

try { state.p2p = new BroadcastChannel("lai_p2p"); } catch(e){}

/* ==================== UTILS ==================== */
const $ = id => document.getElementById(id);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function sha256(t){ const b = new TextEncoder().encode(t); const h = await crypto.subtle.digest("SHA-256", b); return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function toast(m){ const t=$("tst"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }
function chatKey(){ return state.current ? `lai_chats_${state.current}` : null; }
function saveChats(){ if(chatKey()) localStorage.setItem(chatKey(), JSON.stringify(state.chats)); }

/* ==================== AUTH ==================== */
function showErr(m){ const e=$("err"); e.textContent=m; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),3000); }

async function doLogin(e){
    e.preventDefault();
    const u = $("login-user").value.trim();
    const p = $("login-pass").value;
    const user = state.users[u];
    if(!user){ showErr("Пользователь не найден"); return false; }
    const hash = await sha256(p);
    if(hash !== user.hash){ showErr("Неверный пароль"); return false; }
    state.current = u;
    localStorage.setItem("lai_current", u);
    enterApp();
    return false;
}

async function doRegister(e){
    e.preventDefault();
    const u = $("reg-user").value.trim();
    const p = $("reg-pass").value;
    const p2 = $("reg-pass2").value;
    if(state.users[u]){ showErr("Логин занят"); return false; }
    if(p !== p2){ showErr("Пароли не совпадают"); return false; }
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(u)){ showErr("Логин: 3-20 символов, a-z, 0-9, _"); return false; }
    state.users[u] = { hash: await sha256(p), created: Date.now() };
    localStorage.setItem("lai_users", JSON.stringify(state.users));
    state.current = u;
    localStorage.setItem("lai_current", u);
    enterApp();
    toast("Аккаунт создан");
    return false;
}

function logout(){
    if(!confirm("Выйти из аккаунта?")) return;
    state.current = null;
    localStorage.removeItem("lai_current");
    $("app").classList.remove("active");
    $("auth").classList.remove("hidden");
    $("login-pass").value = "";
    $("reg-pass").value = "";
    $("reg-pass2").value = "";
}

function enterApp(){
    $("auth").classList.add("hidden");
    $("app").classList.add("active");
    const u = state.current;
    $("un").textContent = u;
    $("ua").textContent = u[0].toUpperCase();
    loadChats();
    if(state.chats.length === 0) newChat();
    renderChatList();
    renderMessages();
    $("inp").focus();
}

/* ==================== CHATS ==================== */
function loadChats(){
    const k = chatKey();
    state.chats = k ? JSON.parse(localStorage.getItem(k) || "[]") : [];
    state.activeChat = state.chats[0]?.id || null;
}

function newChat(){
    const c = { id: uid(), title: "Новый чат", messages: [], created: Date.now() };
    state.chats.unshift(c);
    state.activeChat = c.id;
    saveChats(); renderChatList(); renderMessages();
    return c;
}

function getChat(){ return state.chats.find(c => c.id === state.activeChat); }

function delChat(id){
    state.chats = state.chats.filter(c => c.id !== id);
    if(!state.chats.length) newChat();
    else if(state.activeChat === id) state.activeChat = state.chats[0].id;
    saveChats(); renderChatList(); renderMessages();
}

function switchChat(id){
    state.activeChat = id;
    saveChats(); renderChatList(); renderMessages();
    if(innerWidth <= 768) $("side").classList.remove("open");
}

function renderChatList(){
    const el = $("chat-list"); el.innerHTML = "";
    state.chats.forEach(c => {
        const d = document.createElement("div");
        d.className = "ci" + (c.id === state.activeChat ? " active" : "");
        d.innerHTML = `<span class="ci-t">${esc(c.title)}</span><button class="ci-d" data-id="${c.id}">✕</button>`;
        d.onclick = e => { if(e.target.classList.contains("ci-d")) return; switchChat(c.id); };
        d.querySelector(".ci-d").onclick = e => { e.stopPropagation(); if(confirm("Удалить чат?")) delChat(c.id); };
        el.appendChild(d);
    });
}

/* ==================== MARKDOWN ==================== */
function md(text){
    let h = esc(text);
    h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => {
        const code = c.trim();
        return `<div class="cb"><div class="ch"><span class="cl">${l||"text"}</span><button class="cc" data-code="${encodeURIComponent(code)}">Копировать</button></div><pre><code>${hl(code)}</code></pre></div>`;
    });
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    h = h.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    h = h.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    h = h.replace(/^# (.+)$/gm, "<h1>$1</h1>");
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
    h = h.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
    h = h.replace(/(<li>.*<\/li>\n?)+/g, m => "<ul>"+m+"</ul>");
    h = h.replace(/^---$/gm, "<hr>");
    h = h.split("\n\n").map(p => {
        if(/^\s*<(h[1-6]|ul|ol|li|blockquote|pre|div|hr)/.test(p)) return p;
        if(!p.trim()) return "";
        return "<p>"+p.replace(/\n/g,"<br>")+"</p>";
    }).join("\n");
    return h;
}

function hl(code){
    let h = esc(code);
    h = h.replace(/(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)/g, '<span class="tk-com">$1</span>');
    h = h.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="tk-str">$1</span>');
    h = h.replace(/\b(0x[0-9a-fA-F]+|\d+\.?\d*)\b/g, '<span class="tk-num">$1</span>');
    const kw = /\b(auto|break|case|catch|class|const|constexpr|continue|default|delete|do|else|enum|explicit|extern|false|for|friend|goto|if|inline|mutable|namespace|new|nullptr|operator|private|protected|public|register|return|sizeof|static|struct|switch|template|this|throw|true|try|typedef|typename|using|virtual|void|volatile|while|asm|mov|push|pop|call|ret|jmp|jz|jnz|add|sub|mul|div|lea|xor|and|or|not|int|char|float|double|long|short|unsigned|signed|bool)\b/g;
    h = h.replace(kw, '<span class="tk-kw">$1</span>');
    h = h.replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span class="tk-fn">$1</span>(');
    h = h.replace(/\b(std|string|vector|map|set|unique_ptr|shared_ptr)\b/g, '<span class="tk-type">$1</span>');
    return h;
}

/* ==================== RENDER MSGS ==================== */
function renderMessages(){
    const c = getChat(); if(!c) return;
    $("tt").textContent = c.title;
    const el = $("msgs-i"); el.innerHTML = "";
    if(!c.messages.length){ renderEmpty(); return; }
    c.messages.forEach(m => appendMsg(m, false));
    scrollBottom(true);
}

function renderEmpty(){
    const el = document.createElement("div");
    el.className = "empty";
    el.innerHTML = `<div class="emp-i">⚡</div><h3>LudvigAI готов</h3><p>Нейросеть на C++ и ассемблере. Спроси о C++, ассемблере, реверсе.</p>
    <div class="qp">
        <button class="qpb" data-p="Напиши пример AVX2 кода для умножения матриц"><strong>AVX2 код</strong>Умножение матриц на SIMD</button>
        <button class="qpb" data-p="Как работает backpropagation на уровне ассемблера?"><strong>Backprop + ASM</strong>Градиент на уровне инструкций</button>
        <button class="qpb" data-p="Напиши crackme на C++ для тренировки реверса"><strong>CrackMe</strong>Задача для реверса</button>
        <button class="qpb" data-p="Как работает ELF формат? Структура файла"><strong>ELF</strong>Структура ELF файла</button>
    </div>`;
    $("msgs-i").appendChild(el);
    el.querySelectorAll(".qpb").forEach(b => b.onclick = () => { $("inp").value = b.dataset.p; send(); });
}

function appendMsg(m, scroll=true){
    const el = document.createElement("div");
    el.className = "msg " + m.role;
    el.innerHTML = `<div class="ma">${m.role==="user"?"Т":"L"}</div>
    <div class="mb2">
        <div class="mn">${m.role==="user"?"Ты":"LudvigAI"} <span class="mt">сейчас</span></div>
        <div class="mc">${md(m.content)}</div>
        <div class="mac">
            <button class="mab act-copy">Копировать</button>
            ${m.role==="assistant"?`<button class="mab act-regen">Регенерировать</button>`:""}
        </div>
    </div>`;
    $("msgs-i").appendChild(el);
    el.querySelectorAll(".cc").forEach(b => b.onclick = () => {
        navigator.clipboard.writeText(decodeURIComponent(b.dataset.code));
        b.textContent = "Скопировано!"; b.classList.add("copied");
        setTimeout(()=>{b.textContent="Копировать";b.classList.remove("copied");},1500);
    });
    const cp = el.querySelector(".act-copy");
    if(cp) cp.onclick = () => { navigator.clipboard.writeText(m.content); toast("Скопировано"); };
    const rg = el.querySelector(".act-regen");
    if(rg) rg.onclick = () => { const c=getChat(); if(c.messages[c.messages.length-1]?.role==="assistant"){ c.messages.pop(); el.remove(); saveChats(); gen(); } };
    if(scroll) scrollBottom();
    return el;
}

function scrollBottom(inst=false){
    const m = $("msgs");
    if(inst) m.scrollTop = m.scrollHeight;
    else m.scrollTo({top:m.scrollHeight, behavior:"smooth"});
}

/* ==================== SEND ==================== */
async function send(){
    const t = $("inp").value.trim();
    if(!t || state.generating) return;
    const c = getChat(); if(!c) return;
    if(!c.messages.length) $("msgs-i").innerHTML = "";
    const um = { role:"user", content:t, time:Date.now() };
    c.messages.push(um); appendMsg(um);
    if(c.messages.length === 1){ c.title = t.slice(0,40) + (t.length>40?"...":""); $("tt").textContent = c.title; renderChatList(); }
    $("inp").value = ""; $("inp").style.height = "auto";
    saveChats();
    await gen();
}

async function gen(){
    const c = getChat(); if(!c) return;
    state.generating = true; $("sb").disabled = true;
    const el = document.createElement("div");
    el.className = "msg assistant";
    el.innerHTML = `<div class="ma">L</div><div class="mb2">
        <div class="mn">LudvigAI <span class="mt">сейчас</span></div>
        <div class="mc"><div class="typ"><span></span><span></span><span></span></div></div>
        <div class="mac" style="display:none"><button class="mab act-stop">Стоп</button></div>
    </div>`;
    $("msgs-i").appendChild(el);
    scrollBottom();
    state.abort = new AbortController();
    const content = el.querySelector(".mc");
    const actions = el.querySelector(".mac");
    actions.style.display = "flex";
    el.querySelector(".act-stop").onclick = () => state.abort.abort();
    let full = "";
    try {
        const r = await fetch(CFG.apiUrl, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                model: CFG.model,
                messages: [{role:"system",content:SYS}, ...c.messages.map(m=>({role:m.role,content:m.content}))],
                stream: true
            }),
            signal: state.abort.signal
        });
        if(!r.ok) throw new Error("HTTP " + r.status);
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        content.innerHTML = "";
        while(true){
            const {done, value} = await reader.read();
            if(done) break;
            buf += dec.decode(value, {stream:true});
            const lines = buf.split("\n");
            buf = lines.pop();
            for(const line of lines){
                if(!line.startsWith("data: ")) continue;
                const d = line.slice(6).trim();
                if(d === "[DONE]") continue;
                try {
                    const j = JSON.parse(d);
                    const delta = j.choices?.[0]?.delta?.content || "";
                    if(delta){ full += delta; content.innerHTML = md(full); scrollBottom(); }
                } catch(e){}
            }
        }
        if(!full) throw new Error("empty");
    } catch(e){
        if(e.name === "AbortError") full = full || "[остановлено]";
        else full = `**LudvigAI Local Mode**\n\nAPI недоступен (\`${CFG.apiUrl}\`).\n\nТы написал: *${esc(c.messages[c.messages.length-1].content)}*\n\nЧтобы подключить модель:\n1. Открой ⚙ Настройки\n2. Укажи URL API\n3. Модель обновится\n\n---\n*Заглушка. LudvigAI на C++ + ASM будет подключён позже.*`;
    }
    content.innerHTML = md(full);
    actions.innerHTML = `<button class="mab act-copy">Копировать</button><button class="mab act-regen">Регенерировать</button>`;
    actions.querySelector(".act-copy").onclick = () => { navigator.clipboard.writeText(full); toast("Скопировано"); };
    actions.querySelector(".act-regen").onclick = () => { c.messages.pop(); el.remove(); saveChats(); gen(); };
    const am = { role:"assistant", content:full, time:Date.now() };
    c.messages.push(am); saveChats();
    if(state.p2p) state.p2p.postMessage({type:"msg", chatId:c.id, message:am});
    state.generating = false; $("sb").disabled = false;
    scrollBottom();
}

/* ==================== EXPORT ==================== */
function exportChat(){
    const c = getChat(); if(!c) return;
    const txt = `# ${c.title}\n\n` + c.messages.map(m => `## ${m.role==="user"?"Ты":"LudvigAI"}\n\n${m.content}\n`).join("\n---\n\n");
    const b = new Blob([txt], {type:"text/markdown"});
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u; a.download = `ludvigai-${c.id}.md`; a.click();
    URL.revokeObjectURL(u); toast("Экспортировано");
}

/* ==================== EVENTS ==================== */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".form").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    $(t.dataset.tab + "-form").classList.add("active");
});

$("inp").addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("inp").addEventListener("input", () => {
    $("inp").style.height = "auto";
    $("inp").style.height = Math.min($("inp").scrollHeight, 200) + "px";
});
$("sb").onclick = send;
$("newc").onclick = () => { newChat(); if(innerWidth<=768) $("side").classList.remove("open"); };
$("btn-export").onclick = exportChat;
$("btn-logout").onclick = logout;

const THEMES = ["dark","light","amoled"];
$("btn-theme").onclick = () => {
    const i = THEMES.indexOf(CFG.theme);
    CFG.theme = THEMES[(i+1)%THEMES.length];
    applyTheme(); localStorage.setItem("lai_theme", CFG.theme);
};

function applyTheme(){
    document.documentElement.setAttribute("data-theme", CFG.theme);
    $("btn-theme").textContent = {dark:"🌙",light:"☀️",amoled:"⚫"}[CFG.theme];
}

$("mb").onclick = () => $("side").classList.add("open");

$("btn-settings").onclick = () => {
    $("api-url").value = CFG.apiUrl;
    $("api-model").value = CFG.model;
    $("theme-select").value = CFG.theme;
    $("mo").classList.add("show");
};

$("mo-cancel").onclick = () => $("mo").classList.remove("show");
$("mo-save").onclick = () => {
    CFG.apiUrl = $("api-url").value.trim();
    CFG.model = $("api-model").value.trim();
    CFG.theme = $("theme-select").value;
    localStorage.setItem("lai_api", CFG.apiUrl);
    localStorage.setItem("lai_model", CFG.model);
    localStorage.setItem("lai_theme", CFG.theme);
    applyTheme();
    $("mo").classList.remove("show");
    toast("Сохранено");
};

$("mo").onclick = e => { if(e.target === $("mo")) $("mo").classList.remove("show"); };

$("msgs").addEventListener("scroll", () => {
    const d = $("msgs").scrollHeight - $("msgs").scrollTop - $("msgs").clientHeight;
    $("sbt").classList.toggle("visible", d > 300);
});
$("sbt").onclick = () => scrollBottom();

document.addEventListener("keydown", e => {
    if((e.ctrlKey||e.metaKey) && e.key === "k"){ e.preventDefault(); newChat(); }
    if(e.key === "Escape"){ $("mo").classList.remove("show"); $("side").classList.remove("open"); }
});

/* ==================== INIT ==================== */
applyTheme();
if(state.current && state.users[state.current]) enterApp();
</script>
