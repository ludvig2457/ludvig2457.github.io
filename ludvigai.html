<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LudvigAI — Чат</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #0d0d0f;
    --bg-secondary: #16161a;
    --text: #e8e8ea;
    --text-muted: #8a8a92;
    --accent: #6c5ce7;
    --accent-hover: #7d6ef0;
    --border: #2a2a30;
    --user-bg: #6c5ce7;
    --assistant-bg: #1e1e24;
}

[data-theme="light"] {
    --bg: #ffffff;
    --bg-secondary: #f5f5f7;
    --text: #1a1a1f;
    --text-muted: #6a6a72;
    --accent: #6c5ce7;
    --accent-hover: #5b4dd1;
    --border: #e0e0e5;
    --user-bg: #6c5ce7;
    --assistant-bg: #f0f0f3;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.3s, color 0.3s;
}

.chat-container {
    width: 100%;
    max-width: 800px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
}

.logo { display: flex; align-items: center; gap: 12px; }

.logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: white;
}

.logo h1 { font-size: 16px; font-weight: 600; }
.status { font-size: 12px; color: var(--text-muted); }

.header-actions { display: flex; gap: 8px; }

.header-actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
}

.header-actions button:hover { background: var(--border); }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    display: flex;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user { align-self: flex-end; }
.message.assistant { align-self: flex-start; }

.message-content {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.message.user .message-content {
    background: var(--user-bg);
    color: white;
    border-bottom-right-radius: 4px;
}

.message.assistant .message-content {
    background: var(--assistant-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
}

.chat-input {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-secondary);
}

#input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 120px;
}

#input:focus { border-color: var(--accent); }

#send {
    background: var(--accent);
    color: white;
    border: none;
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
}

#send:hover { background: var(--accent-hover); }
#send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat-container">
    <header class="chat-header">
        <div class="logo">
            <span class="logo-icon">L</span>
            <div>
                <h1>LudvigAI</h1>
                <p class="status">Open Source · C++ · ASM</p>
            </div>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" title="Сменить тему">🌙</button>
            <button id="clear-chat" title="Очистить">🗑</button>
        </div>
    </header>

    <main class="chat-messages" id="messages">
        <div class="message assistant">
            <div class="message-content">Привет! Я LudvigAI. Нейросеть на C++ и ассемблере. Спроси меня о C++, ассемблере, реверсе.</div>
        </div>
    </main>

    <footer class="chat-input">
        <textarea id="input" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button id="send" title="Отправить">➤</button>
    </footer>
</div>

<script>
const API_URL = "http://localhost:8080/v1/chat/completions";

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const themeToggle = document.getElementById("theme-toggle");
const clearBtn = document.getElementById("clear-chat");

const conversation = [
    { role: "system", content: "Ты LudvigAI — нейросеть на C++ и ассемблере. Отвечай кратко и по делу." }
];

async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    conversation.push({ role: "user", content: text });
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    const loadingEl = addMessage("assistant", "Думаю...");

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "ludvigai", messages: conversation })
        });

        if (!res.ok) throw new Error("API error");

        const data = await res.json();
        const reply = data.choices[0].message.content;

        loadingEl.querySelector(".message-content").textContent = reply;
        conversation.push({ role: "assistant", content: reply });
    } catch (e) {
        loadingEl.querySelector(".message-content").textContent =
            "Ошибка: API недоступен. LudvigAI ещё не запущен на сервере.";
    }

    sendBtn.disabled = false;
    scrollToBottom();
}

function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text;
    div.appendChild(content);
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
}

function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

sendBtn.addEventListener("click", sendMessage);

themeToggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    themeToggle.textContent = next === "light" ? "☀️" : "🌙";
    localStorage.setItem("theme", next);
});

const savedTheme = localStorage.getItem("theme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeToggle.textContent = savedTheme === "light" ? "☀️" : "🌙";

clearBtn.addEventListener("click", () => {
    messagesEl.innerHTML = "";
    conversation.length = 1;
    addMessage("assistant", "Чат очищен. Чем помочь?");
});
</script>
</body>
</html>
